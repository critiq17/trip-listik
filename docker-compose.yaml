version: '3.8'

services:
  db:
    image: postgres:16
    container_name: trip_listik_db
    restart: always
    environment:
      POSTGRES_USER: myuser
      POSTGRES_PASSWORD: 1234
      POSTGRES_DB: trip_listik
    ports:
      - "5442:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U myuser -d trip_listik"]
      interval: 5s
      timeout: 3s
      retries: 5

volumes:
  postgres_data:
