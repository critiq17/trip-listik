<!DOCTYPE html>

<html class="dark" lang="en"><head>
<meta charset="utf-8"/>
<meta content="width=device-width, initial-scale=1.0" name="viewport"/>
<script src="https://cdn.tailwindcss.com?plugins=forms,container-queries"></script>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&amp;display=swap" rel="stylesheet"/>
<link href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined:wght@100..700,0..1&amp;display=swap" rel="stylesheet"/>
<link href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined:wght,FILL@100..700,0..1&amp;display=swap" rel="stylesheet"/>
<script id="tailwind-config">
        tailwind.config = {
            darkMode: "class",
            theme: {
                extend: {
                    colors: {
                        "primary": "#4d9d6d",
                        "background-light": "#f6f7f7",
                        "background-dark": "#161c18",
                    },
                    fontFamily: {
                        "display": ["Inter", "sans-serif"]
                    },
                    borderRadius: {"DEFAULT": "0.25rem", "lg": "0.5rem", "xl": "0.75rem", "full": "9999px"},
                },
            },
        }
    </script>
<style>
        .glow-shadow {
            box-shadow: 0 0 15px rgba(77, 157, 109, 0.4);
        }
    </style>
<style>
    body {
      min-height: max(884px, 100dvh);
    }
  </style>
  </head>
<body class="bg-background-light dark:bg-background-dark font-display text-slate-900 dark:text-slate-100 antialiased">
<div class="relative flex min-h-screen w-full max-w-[480px] mx-auto flex-col bg-background-light dark:bg-background-dark overflow-x-hidden">
<!-- Header -->
<div class="flex items-center p-4 justify-between border-b border-slate-200 dark:border-primary/10">
<button class="flex size-10 items-center justify-center rounded-full hover:bg-slate-200 dark:hover:bg-primary/20">
<span class="material-symbols-outlined">arrow_back</span>
</button>
<h2 class="text-lg font-bold flex-1 text-center pr-10">Create Trip</h2>
</div>
<!-- Progress Bar -->
<div class="flex flex-col gap-2 p-4 pt-6">
<div class="flex justify-between items-end">
<p class="text-primary text-xs font-bold tracking-widest uppercase">Step 3 of 3</p>
<p class="text-primary text-sm font-semibold">100%</p>
</div>
<div class="h-2 w-full bg-slate-200 dark:bg-slate-800 rounded-full overflow-hidden">
<div class="h-full bg-primary rounded-full transition-all duration-500" style="width: 100%;"></div>
</div>
</div>
<!-- Main Content -->
<div class="flex-1 flex flex-col p-4 gap-8">
<div>
<h1 class="text-2xl font-bold mb-6">Who's coming along?</h1>
<!-- Chips Area -->
<div class="flex flex-wrap gap-2 mb-4">
<!-- Selected Friend Chip -->
<div class="flex items-center gap-2 bg-primary/20 border border-primary/30 py-1 pl-1 pr-2 rounded-full">
<img class="w-7 h-7 rounded-full object-cover" data-alt="Profile photo of a smiling man" src="https://lh3.googleusercontent.com/aida-public/AB6AXuCrF2SLlu_yIEDcPLFXJ6vNA7Hn9sDcY_gTjRIlIh3QESI6A-2kGJ9cdKfynaGvKRrkp0fUE4GNTOAZDFvAxJd_Zv049z4TjGKIWsO2CFJ88ynDCVbFFqTjiqudGJti2mUjBz0GqhdxVycWJKlm_kA6qyoexFary7sOixEZtRH7tbuxe0VfeAA5lLWm8_yT2rpltIM-feP8YP-AEqaXWEahATTuHzl0_BrMGmvk-Nsn2I483pK3bUg113if2Ym-qA9Gz1LlekUskpI"/>
<span class="text-sm font-medium">Alex Rivera</span>
<button class="flex items-center justify-center">
<span class="material-symbols-outlined text-sm">close</span>
</button>
</div>
<div class="flex items-center gap-2 bg-primary/20 border border-primary/30 py-1 pl-1 pr-2 rounded-full">
<img class="w-7 h-7 rounded-full object-cover" data-alt="Profile photo of a smiling woman" src="https://lh3.googleusercontent.com/aida-public/AB6AXuCnErVjSPHfJXCfgX1fb-vAMpTa9AuSCH586RhH0YJzLAf6YzV6-zOzgXzkd4ldxhra9e-Lq2IGCMqix48sVZGLOG4O4fZXwaVyo2L2HHdDFS_NNh0H7BUmvLIO_K5QcDnm2rZDn4knYENiEmoBzSWtOsZUB4lzdz-hY3ASatxjjck9PXJzxtv6s9DGOOY7q_PbcE9xvbdvgb4yGGaE_yn0plPBMcAA3FTq3QYsBXmz00bOfGfcBZNeaIr74HuQkEWhTTFhVQMrnU0"/>
<span class="text-sm font-medium">Sarah Chen</span>
<button class="flex items-center justify-center">
<span class="material-symbols-outlined text-sm">close</span>
</button>
</div>
</div>
<!-- Friend Search -->
<div class="relative group">
<input class="w-full bg-transparent border-t-0 border-x-0 border-b-2 border-slate-300 dark:border-slate-700 focus:border-primary focus:ring-0 px-0 py-3 text-lg placeholder:text-slate-400 dark:placeholder:text-slate-600 transition-colors" placeholder="Search friends..." type="text"/>
<span class="material-symbols-outlined absolute right-0 top-1/2 -translate-y-1/2 text-slate-400">search</span>
</div>
</div>
<!-- Description Field -->
<div class="flex flex-col gap-2">
<label class="text-sm font-semibold text-slate-500 dark:text-slate-400">Trip Description (Optional)</label>
<textarea class="w-full bg-transparent border-t-0 border-x-0 border-b-2 border-slate-300 dark:border-slate-700 focus:border-primary focus:ring-0 px-0 py-2 resize-none text-base placeholder:text-slate-400 dark:placeholder:text-slate-600 transition-colors" placeholder="Tell everyone what the plan is..." rows="3"></textarea>
</div>
<!-- Action Button -->
<div class="mt-auto pb-8">
<button class="w-full bg-primary text-white font-bold py-4 rounded-xl text-lg glow-shadow hover:scale-[0.99] transition-transform active:scale-95">
                    Create Trip
                </button>
</div>
</div>
<!-- Bottom Navigation Bar -->
<div class="mt-auto border-t border-slate-200 dark:border-primary/10 bg-white dark:bg-background-dark px-4 pb-6 pt-2">
<div class="flex justify-between items-center max-w-md mx-auto">
<a class="flex flex-col items-center gap-1 text-slate-400" href="#">
<span class="material-symbols-outlined">home</span>
<p class="text-[10px] font-medium">Home</p>
</a>
<a class="flex flex-col items-center gap-1 text-slate-400" href="#">
<span class="material-symbols-outlined">luggage</span>
<p class="text-[10px] font-medium">Trips</p>
</a>
<a class="flex flex-col items-center gap-1 text-primary" href="#">
<span class="material-symbols-outlined" style="font-variation-settings: 'FILL' 1">add_circle</span>
<p class="text-[10px] font-bold">Create</p>
</a>
<a class="flex flex-col items-center gap-1 text-slate-400" href="#">
<span class="material-symbols-outlined">group</span>
<p class="text-[10px] font-medium">Friends</p>
</a>
<a class="flex flex-col items-center gap-1 text-slate-400" href="#">
<span class="material-symbols-outlined">person</span>
<p class="text-[10px] font-medium">Profile</p>
</a>
</div>
</div>
</div>
</body></html>
