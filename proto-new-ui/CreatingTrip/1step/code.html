<!DOCTYPE html>

<html class="dark" lang="en"><head>
<meta charset="utf-8"/>
<meta content="width=device-width, initial-scale=1.0" name="viewport"/>
<title>Create Trip - Step 1</title>
<script src="https://cdn.tailwindcss.com?plugins=forms,container-queries"></script>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&amp;family=DM+Serif+Display&amp;display=swap" rel="stylesheet"/>
<link href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined:wght@100..700,0..1&amp;display=swap" rel="stylesheet"/>
<link href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined:wght,FILL@100..700,0..1&amp;display=swap" rel="stylesheet"/>
<script id="tailwind-config">
        tailwind.config = {
            darkMode: "class",
            theme: {
                extend: {
                    colors: {
                        "primary": "#4d9d6d",
                        "background-light": "#f6f7f7",
                        "background-dark": "#161c18",
                    },
                    fontFamily: {
                        "display": ["Inter", "sans-serif"],
                        "serif": ["DM Serif Display", "serif"]
                    },
                    borderRadius: {
                        "DEFAULT": "0.25rem",
                        "lg": "0.5rem",
                        "xl": "0.75rem",
                        "full": "9999px"
                    },
                },
            },
        }
    </script>
<style>
        .material-symbols-outlined {
            font-variation-settings: 'FILL' 0, 'wght' 400, 'GRAD' 0, 'opsz' 24;
        }
        .active-icon {
            font-variation-settings: 'FILL' 1, 'wght' 400, 'GRAD' 0, 'opsz' 24;
        }
    </style>
<style>
    body {
      min-height: max(884px, 100dvh);
    }
  </style>
  </head>
<body class="bg-background-light dark:bg-background-dark font-display text-slate-900 dark:text-slate-100 min-h-screen flex flex-col">
<!-- Progress Bar -->
<div class="w-full h-1 bg-primary/20">
<div class="h-full bg-primary" style="width: 33.33%;"></div>
</div>
<main class="flex-1 flex flex-col max-w-md mx-auto w-full px-6 pt-8 pb-24">
<!-- Step Indicator -->
<p class="text-primary text-xs font-bold tracking-widest uppercase mb-4">Step 1 of 3</p>
<!-- Headline -->
<h1 class="font-serif text-4xl mb-10 text-slate-900 dark:text-slate-50">Where are you headed?</h1>
<!-- Form Fields -->
<div class="space-y-12">
<!-- Trip Name Input -->
<div class="relative">
<label class="block text-sm font-medium text-slate-500 dark:text-slate-400 mb-1">Trip Name</label>
<input class="w-full bg-transparent border-0 border-b-2 border-slate-200 dark:border-slate-800 focus:ring-0 focus:border-primary px-0 py-3 text-2xl font-medium placeholder:text-slate-300 dark:placeholder:text-slate-700 transition-colors" placeholder="e.g. Summer in Tuscany" type="text"/>
</div>
<!-- Destination Input -->
<div class="relative">
<label class="block text-sm font-medium text-slate-500 dark:text-slate-400 mb-1">Destination</label>
<div class="flex items-center">
<input class="w-full bg-transparent border-0 border-b-2 border-slate-200 dark:border-slate-800 focus:ring-0 focus:border-primary px-0 py-3 text-2xl font-medium placeholder:text-slate-300 dark:placeholder:text-slate-700 transition-colors" placeholder="Where to?" type="text"/>
<span class="material-symbols-outlined absolute right-0 text-slate-400">map</span>
</div>
</div>
<!-- Cover Photo Upload Placeholder -->
<div class="mt-4">
<label class="block text-sm font-medium text-slate-500 dark:text-slate-400 mb-3">Cover Photo</label>
<div class="w-full aspect-video rounded-xl border-2 border-dashed border-slate-200 dark:border-slate-800 bg-slate-50/50 dark:bg-slate-900/50 flex flex-col items-center justify-center cursor-pointer hover:border-primary/50 transition-all">
<div class="w-12 h-12 rounded-full bg-primary/10 flex items-center justify-center mb-2">
<span class="material-symbols-outlined text-primary text-3xl">add_a_photo</span>
</div>
<span class="text-xs text-slate-400 font-medium">Add a cover image</span>
</div>
</div>
</div>
<!-- Continue Button -->
<div class="mt-12">
<button class="w-full bg-primary hover:bg-primary/90 text-white font-bold py-4 rounded-xl shadow-lg shadow-primary/20 transition-all flex items-center justify-center gap-2">
                Continue
                <span class="material-symbols-outlined">arrow_forward</span>
</button>
</div>
</main>
<!-- Bottom Navigation -->
<nav class="fixed bottom-0 left-0 right-0 bg-white/80 dark:bg-background-dark/80 backdrop-blur-lg border-t border-slate-200 dark:border-slate-800 px-6 py-3 flex justify-between items-center z-50">
<a class="flex flex-col items-center gap-1 text-slate-400 hover:text-primary transition-colors" href="#">
<span class="material-symbols-outlined">home</span>
<span class="text-[10px] font-medium uppercase tracking-tighter">Home</span>
</a>
<a class="flex flex-col items-center gap-1 text-slate-400 hover:text-primary transition-colors" href="#">
<span class="material-symbols-outlined text-2xl">explore</span>
<span class="text-[10px] font-medium uppercase tracking-tighter">Explore</span>
</a>
<!-- Active State for Create -->
<a class="flex flex-col items-center gap-1 text-primary" href="#">
<div class="bg-primary/10 rounded-full p-1 -mt-1">
<span class="material-symbols-outlined active-icon text-3xl">add_circle</span>
</div>
<span class="text-[10px] font-bold uppercase tracking-tighter">Create</span>
</a>
<a class="flex flex-col items-center gap-1 text-slate-400 hover:text-primary transition-colors" href="#">
<span class="material-symbols-outlined">favorite</span>
<span class="text-[10px] font-medium uppercase tracking-tighter">Saved</span>
</a>
<a class="flex flex-col items-center gap-1 text-slate-400 hover:text-primary transition-colors" href="#">
<span class="material-symbols-outlined">person</span>
<span class="text-[10px] font-medium uppercase tracking-tighter">Profile</span>
</a>
</nav>
</body></html>
