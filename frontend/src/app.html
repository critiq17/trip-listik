<!doctype html>
<html lang="en">
	<head>
		<meta charset="utf-8" />
		<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
		<link rel="preconnect" href="https://fonts.googleapis.com" />
		<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
		<link
			href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap"
			rel="stylesheet"
		/>
		<link
			href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined:wght@100..700&display=swap"
			rel="stylesheet"
		/>
		<script src="https://telegram.org/js/telegram-web-app.js"></script>
		<script>
			// Paint Telegram chrome white before the app bundle loads, otherwise
			// dark-theme users see a black background until layout onMount runs.
			try {
				var tg = window.Telegram && window.Telegram.WebApp;
				if (tg) {
					tg.setBackgroundColor && tg.setBackgroundColor('#ffffff');
					tg.setHeaderColor && tg.setHeaderColor('#ffffff');
					tg.setBottomBarColor && tg.setBottomBarColor('#ffffff');
				}
			} catch (e) {}
		</script>
		%sveltekit.head%
	</head>
	<body data-sveltekit-preload-data="hover">
		<div style="display: contents">%sveltekit.body%</div>
	</body>
</html>
